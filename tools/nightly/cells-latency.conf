# Cells the nightly latency lane runs, one per line.
# The runner reads this file when the lane is on (NIGHTLY_LATENCY_BANDS set,
# or --latency-bands). A name that is not in the catalog fails the run.
# A quester_* name fails the run. Nothing is dropped without a word.
#
# How this list is chosen (NIGHTLY-LATENCY-1022):
#
# - Each cell passed at zero latency in the malbec 2026-10-21 dev run.
#   A latency verdict needs a clean zero baseline on the same night.
# - Each cell exercises a timing path: tick-counted waits, dual-bound
#   waits, wall-clock windows, same-tick batches, or seat answers.
# - Each cell wall stays under about 200 s on malbec, so three bands
#   stay cheap. No cell needs the GPU.
# - No quester_* cell: the quest job uses a 300 ms tick on Engine Q.
#   That fact would confound a first latency reading.
# - No pair-gate cell: two delayed clients double the fault space.
#
# Exclusions stay excluded until a design update names them:
# moss_giant_bank (fails at zero), jive_dragons and jive_kbd (too long),
# guardian_skill_rock_golem and fight_field_v2_ts (mixed zero results),
# render_* cells (no network timing content).

