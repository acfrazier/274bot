[package]
name = "host-play"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
api = { path = "../api" }
client = { workspace = true }
host = { path = "../host" }
nav = { path = "../nav" }
scenario = { path = "../scenario", optional = true }
script = { path = "../script", features = ["load"] }
serde_json = "=1.0.140"
libc = "0.2"
vault = { path = "../vault" }
rand_core = { version = "=0.6.4", features = ["getrandom"] }

# Process working-set + CPU times (GetProcessMemoryInfo / GetProcessTimes).
# Match host/client direct pin windows-sys 0.59 (socket hop); target-only.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
] }

[features]
# Opt-in memory benchmark harness. No effect unless BOT_MEMORY_N is set.
# Frontend binaries install CountingAllocator (T3).
memory-profile = ["script/memory-profile", "dep:scenario"]

# CPU diagnostic: use System directly, report allocator metrics unavailable.
memory-profile-no-alloc = ["memory-profile"]

# Opt-in A1 rebuild-edge exact family body dedup candidate (not default).
snapshot-dedup = ["api/snapshot-dedup", "host/snapshot-dedup"]
