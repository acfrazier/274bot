[live]
globs = [
  "Cargo.toml",
  "Cargo.lock",
  "**/Cargo.toml",
  "**/build.rs",
  "crates/api/src/**",
  "crates/api/build_support/catalog_codegen.rs",
  "crates/api/data/**",
  "crates/host/src/**",
  "crates/host-play/src/**",
  "crates/host-play/tests/survivable_admission_live.rs",
  "crates/host-play/tests/walk_no_route_live.rs",
  "crates/host-play/tests/nav_quest_doors_live.rs",
  "crates/host-play/tests/nav_gated_entrances_live.rs",
  "crates/host-play/tests/nav_prereq_live.rs",
  "crates/host-play/tests/quester_families_live.rs",
  "crates/nav-bake/src/transport/**",
  "crates/nav-bake/src/transport.rs",
  "crates/frontend-core/src/**",
  "crates/panel/src/**",
  "crates/panel/assets/**",
  "crates/tui/src/**",
  "crates/nav-planner/src/**",
  "crates/nav-executor/src/**",
  "crates/script/src/**",
  "crates/script-js/src/**",
  "crates/script-js/examples/guardian_claim_toggle.js",
  "crates/script-js/examples/combat_showcase_v2.ts",
  "crates/script/fonts/**",
  "crates/script-js/compat-js/*.json",
  "crates/script-js/compat-js/*.d.ts",
  "crates/script-js/host-js/**",
  "crates/script-js/schema/**",
  "crates/script/paths/**",
  "crates/scenario/src/**",
  "crates/vault/src/**",
  "vendor/fr-client-rust",
  "vendor/fr-client-rust/crates/client/src/**",
  "vendor/dear-imgui-wgpu-0.15.1/**",
]

[not_live]
globs = [
  "docs/**",
  ".github/**",
  "tools/**",
  # Offline audit, toolchain and vendor dependency metadata. Full CI still
  # checks these inputs; they do not select a gameplay route.
  ".cargo/audit.toml",
  "rust-toolchain.toml",
  "vendor/fr-client-rust/Cargo.lock",
  "vendor/fr-client-rust/rust-toolchain.toml",
  "crates/script/paths/path.schema.json",
  "crates/e2e/**",
  "crates/nav-bake/src/bake.rs",
  "crates/nav-bake/src/transport.rs",
  "crates/nav-bake/src/transport/static_routes.rs",
  # Exact offline producer/template paths. README's final-head pack, corpus
  # and affected-cell rule applies; no generated-route proof is waived.
  "crates/nav-bake/src/bin/nav-pack.rs",
  "crates/nav-bake/src/transport/engine_obstacle_procs.rs2",
  "crates/nav-bake/src/transport/legends.rs",
  "crates/nav-bake/src/transport/legends_axe_template.rs2",
  "crates/nav-bake/src/transport/legends_coords_template.rs2",
  "crates/nav-bake/src/transport/legends_gate_template.rs2",
  "crates/nav-bake/src/transport/legends_jungle_template.rs2",
  "crates/nav-bake/src/transport/observable.rs",
  "crates/nav-bake/src/transport/obstacle_handlers.rs2",
  "crates/nav-bake/src/transport/stage_doors.rs",
  "crates/nav-bake/src/transport/stage_doors_entrances.rs",
  "crates/nav-bake/src/transport/stage_doors_forced.rs",
  "crates/nav-bake/src/transport/stage_doors_obstacles.rs",
  "crates/nav-bake/src/transport/vertical.rs",
  "crates/nav-planner/examples/route_parity.rs",
  "crates/host-play/Cargo.toml",
  "crates/host/Cargo.toml",
  "crates/script-js/src/tooling/compat_dts.rs",
  # deleted by script split S3; its code moved to `script-js`
  # S3 commit: 6831a262cbb35272e6a596b14a1239901b1ea90b.
  "crates/script/src/shim/mod.rs",
  "crates/host-play/src/bank_core_live.rs",
  "crates/host-play/src/bank_fetch_closed_live.rs",
  # Test/live-harness only: host-play/src/lib.rs:634-635 gates this module
  # with cfg(any(test, all(feature = "live-harness", feature = "test-support"))).
  "crates/host-play/src/bank_npc_live.rs",
  "crates/host-play/src/bank_memory_live.rs",
  "crates/host-play/src/gather_bait_live.rs",
  "crates/host-play/src/gather_held_live.rs",
  "crates/host-play/src/script_bank_harness.rs",
  "crates/host-play/src/gather_return_live.rs",
  "crates/host-play/src/gatherer_recovery_live.rs",
  # Ignored live-test drivers; these exercise production but are not production code.
  "crates/host-play/src/bank_npc_live.rs",
  # Shared CPU replay fixture used only by the bank live-test modules.
  "crates/host-play/src/script_bank_harness.rs",
  # Retired in this cut: the shared fixture module and cfg(test) declaration
  # were removed after its callers were cut; it is not active test support.
  "crates/host-play/src/test_support.rs",
  # Synthetic planner fixture builders, not runtime planner code.
  "crates/nav-planner/src/test_support.rs",
  # The stub surface run for tests: `surface.rs` gates this module with
  # #[cfg(any(test, feature = "test-hooks"))]. Only dev-dependencies and the
  # host-play `test-support` test-harness feature enable `test-hooks`.
  "crates/script/src/surface/test_support.rs",
  # Developer bake command line. It writes the packs the nav cells consume; its
  # derivation is `nav_bake::bake`, covered by the transport globs above.
  "crates/nav-bake/src/bin/nav-pack.rs",
  "**/tests/**",
  "**/benches/**",
  "**/*_tests.rs",
  "**/*_test.rs",
  "**/test_support/**",
  # Offline real-pack diagnostic example, not a product runtime. Its release
  # corpus and combined-pack qualification remain mandatory separate proofs.
  "crates/nav-planner/examples/route_parity.rs",
  "crates/panel/src/test_support.rs",
  "**/fixtures/**",
  "**/tests.rs",
  "**/test.rs",
  "**/*.test.ts",
  "**/*.spec.ts",
  "**/package.json",
  "**/package-lock.json",
  "**/clippy.toml",
  "**/*.md",
  "**/*.conf",
  "**/*.yml",
  "**/*.yaml",
  "**/*.cjs",
  ".gitignore",
  ".gitmodules",
  # The nav-pack baker runs at release time and ships no runtime path. A live
  # cell meets its output only as the baked pack. The BR2-S3 review round
  # proves these files with real 274 and 289 bakes (section sizes and a stand
  # audit against the client reach strategy), the route corpus against the v17
  # reference, and the nav cells above on the v18 289 pack. Each file is listed
  # by name, so a later baker change is classified again.
  "crates/nav-bake/src/bake.rs",
  "crates/nav-bake/src/canlight.rs",
  "crates/nav-bake/src/lib.rs",
  "crates/nav-bake/src/pack.rs",
  "crates/nav-bake/src/pack/encode.rs",
  "crates/nav-bake/src/pack/multiway.rs",
  "crates/nav-bake/src/reachability.rs",
  "crates/nav-bake/src/transport/static_routes.rs",
  # Release input inventories: the baker reads every row. The quester path
  # compiler reads only the `map` rows (`script/src/quester/nav_coverage.rs`),
  # and the BR2-S3 change adds one non-map row, so no path compiles differently.
  "crates/nav-planner/src/required-content-274.tsv",
  "crates/nav-planner/src/required-content-289.tsv",
  # ADR 0019 retires these exact tracked paths. Remove an entry if that path
  # returns to tracked source; deleted-path reporting stays a separate follow-up.
  "crates/api/src/family_asset.rs",
  "crates/api/data/game-data/274/debug.json",
  "crates/api/data/game-data/274/gathering.json",
  "crates/api/data/game-data/289/debug.json",
  "crates/api/data/game-data/bank-catalog.rs",
  "crates/api/data/game-data/cook-catalog.rs",
  "crates/api/data/game-data/manifest.json",
  "crates/host-play/examples/cache_manifest.rs",
  "crates/host-play/src/nav_identity.rs",
  "crates/nav-bake/src/bin/cache-content-id.rs",
  "crates/nav-bake/src/bin/nav-input-audit.rs",
  "crates/nav-bake/src/bundle.rs",
  "crates/nav-bake/src/manifest.rs",
  "crates/nav-bake/src/test_support.rs",
  "crates/nav-planner/src/map/services.rs",
  # These modules are explicitly gated to tests or test-support.
  "crates/api/src/test_support.rs",
  "crates/host-play/src/tick_engine_test_support.rs",
  "crates/host-play/src/script_server_ordered_tests/gatherer_relog.rs",
  "crates/host-play/src/script_server_ordered_tests/native_relog.rs",
  # Exact offline producers. Canonical 274/289 bootstrap, corpus and consuming
  # navigation cells remain required; this is not a runtime-proof exemption.
  "crates/nav-bake/Cargo.toml",
  "crates/nav-bake/src/pack/sidecars.rs",
  "crates/nav-bake/src/services.rs",
]

exceptions = [
  "crates/host-play/tests/survivable_admission_live.rs",
  "crates/host-play/tests/nav_prereq_live.rs",
  "crates/host-play/tests/quester_families_live.rs",
  "crates/host-play/tests/nav_quest_doors_live.rs",
  "crates/host-play/tests/nav_gated_entrances_live.rs",
