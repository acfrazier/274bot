[package]
name = "e2e"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "e2e"
path = "src/lib.rs"

# Tracked native suite entrypoint over the existing native executables.
[[bin]]
name = "e2e-suite"
path = "src/bin/e2e-suite.rs"

# Disposable child used by the suite's offline verification: it speaks the same
# terminal-receipt/capture lines as the real panel entries without a client, engine or
# gameplay. Never used by a real run.
[[bin]]
name = "e2e-suite-fixture"
path = "src/bin/e2e-suite-fixture.rs"

[dependencies]
host = { path = "../host" }
host-play = { path = "../host-play" }
vault = { path = "../vault" }
api = { path = "../api" }
nav = { path = "../nav" }
scenario = { path = "../scenario" }
client = { workspace = true }
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"
sha2 = "=0.10.9"
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Native job-object ownership for the launched child tree (and the console-control
# handler an interrupt needs): the Windows half of `suite::child`'s ownership facility.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }
