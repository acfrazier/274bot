# Cells the revision-274 nightly lane runs (zinfandel), one per line.
# The runner reads this file through --cells-file (NIGHTLY_CELLS_FILE).
# A name that is not in the catalog fails the run. Nothing is dropped
# without a word.
#
# How this list is chosen (NIGHTLY-274, 2026-10-20):
#
# The catalog has no revision field. A cell implies revision through
# the content it touches and any game-data oracle it uses. This list
# This list selects 104 cells from the catalog; the original 103 passed on
# the 289 dev lane on 2026-10-19. The far-start cell is new to the 274 lane.
#
# Exclusions:
# - Other variants in selected families: breadth. Run one or two per family.
# - quester_* (9 cells): quester.rs selects ClientRevision::R289.
# - guardian_event_* and guardian_skill_*: runner.rs:1242 builds the
#   random-event oracle from R289 NPC data. The engine cannot change
#   that client-side oracle.
# - Cells that were not PASS on the 2026-10-19 289 dev run: known
#   289 failures, timeouts, or unsupported cases, not a clean baseline.
# - quester_path: needs a separate path and seeds. skip.conf excludes it
#   from catalog sweeps.
#
# The lamp_redemption cell uses its dedicated lamp observation, not the
# random-event oracle.
#
# Cell cap is 900 s. Night cap is 9000 s (2 h 30 min), below 3 h.
# The selected cell names come from the complete catalog on each run.
# A name that leaves the catalog fails the runner's cell-list check.

