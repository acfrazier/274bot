[package]
name = "host"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
api = { path = "../api" }
client = { workspace = true }
num-bigint = "0.4"
serde = { version = "=1.0.219", features = ["derive"] }
vault = { path = "../vault" }

[features]
default = []
snapshot-dedup = ["api/snapshot-dedup"]
memory-owner-capture = ["api/memory-owner-capture", "client/memory-owner-capture"]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Networking_WinSock"] }

# Dev-only: real queue.on_submitted_work_done smoke (soft-skips without adapter).
[dev-dependencies]
pollster = "0.4"
wgpu = "29"
