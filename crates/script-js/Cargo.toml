[package]
name = "script-js"
version.workspace = true
edition = "2021"
publish = false

[features]
# Integration-only test seams, enabled through dev-dependencies rather than
# normal consumers. Preserve checked-in JSON ordering for test snapshots.
test-hooks = ["script/test-hooks", "serde_json/preserve_order"]
# Opt-in counters for the host-play memory-profile harness (V8 heap /
# snapshot inflight).
memory-profile = []

[dependencies]
api = { path = "../api" }
# TS parse for import scans and the TS -> JS strip used by the catalog shape.
deno_ast = { version = "=0.49.0", features = ["transpiling"] }
deno_core = { version = "=0.355.0" }
# Isolate IPC wire format (schema: `crates/script-js/schema/isolate.fbs`);
# Rust bindings are checked-in pinned `flatc` output, so builds need no generator.
flatbuffers = { version = "=25.12.19" }
parking_lot = "=0.12.5"
rand = "=0.8.5"
rustyscript = { version = "=0.12.3", default-features = false, features = ["worker", "web_stub", "console"] }
script = { path = "../script", features = ["canvas-raster"] }
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"
sha2 = "=0.10.9"
thiserror = "=2.0.20"
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "time"] }
vault = { path = "../vault" }
v8 = { version = "=137.2.1", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
api = { path = "../api", features = ["test-support"] }
allocation-counter = "=0.8.1"
client = { workspace = true }
nav-planner = { path = "../nav-planner" }
script = { path = "../script", default-features = false, features = ["test-hooks"] }
script-js = { path = ".", default-features = false, features = ["test-hooks"] }

[[test]]
name = "v8_platform"
harness = false

