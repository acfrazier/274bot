name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      # Bot crates only: --all would also format the vendored client submodule
      # (separate workspace, intentionally not reformatted).
      - name: Check formatting (bot crates)
        run: cargo fmt -p host -p vault -p api -p host-play -p e2e -p panel -p nav -p script -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # The vendored client is a path dependency with its own lint debt; clippy
      # lints path deps even when excluded, so --no-deps keeps the pass on the
      # 274bot crates only.
      - name: Clippy (bot crates, warnings denied)
        run: cargo clippy --workspace --exclude client --all-targets --no-deps -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # No LIVE=1: the live harness tests stay #[ignore]d.
      - name: Test (bot crates)
        run: cargo test --workspace --exclude client
