# Live cells the nightly run does not start, with the reason printed in the
# summary. Format: <cell name><TAB or spaces><reason>. A skipped cell is
# still listed in summary.json/summary.md as SKIP with this reason; nothing
# is dropped silently. Names are scenario names (without the `script_`
# prefix). Cells that need a different engine (for example Engine Q at a
# 300 ms world tick) belong here.
quester_path    needs QUESTER_PATH (one quest id per run) and its seeds; run through the Quester Path smoke, not the catalog sweep
client_377     needs revision-377 engine, cache and nav inputs; the nightly runs revisions 274 and 289 only, so a 289 run is a wrong-profile fixture (0 ticks, 2026-11-12 triage)
cook_377       needs revision-377 engine, cache and nav inputs; the nightly runs revisions 274 and 289 only, so a 289 run is a wrong-profile fixture (0 ticks, 2026-11-12 triage)
quest_watch_seed    needs QUEST_WATCH_SEED (a quest-watch plan JSON); run through the quest-watch harness, not the catalog sweep
quest_watch_speed    needs QUEST_WATCH_SPEED_MS and Engine Q (300 ms world tick); run on Engine Q, not the catalog sweep
