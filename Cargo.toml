[workspace]
resolver = "2"
members = ["crates/host", "crates/vault", "crates/api", "crates/host-play", "crates/frontend-core", "crates/e2e", "crates/panel", "crates/nav-planner", "crates/nav-executor", "crates/nav-bake", "crates/script", "crates/script-js", "crates/scenario", "crates/tui", "tools/seat-model"]

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"
unwrap_used = "warn"
# Suppression hygiene: `allow_attributes` forces `#[expect]` (an expectation
# that stops firing is an error), and `allow_attributes_without_reason`
# requires every suppression to justify itself. The six approved lints below
# are the current ratchet set. `vault`, `nav-planner`, and `nav-bake` opt in
# (`[lints] workspace = true` in their manifests). A refactored crate stays opted in.
# These denies apply to test code too: clippy 1.98 offers no per-lint
# `allow-*-in-tests` knob for any of them (only `unwrap_used` is scoped to
# non-test code, via `allow-unwrap-in-tests` in clippy.toml), so opted-in
# crates keep their tests clean as well.
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
redundant_clone = "deny"
significant_drop_in_scrutinee = "deny"
unchecked_time_subtraction = "deny"
needless_collect = "deny"
large_types_passed_by_value = "deny"
assigning_clones = "deny"

[workspace.package]
version = "0.2.8"

[workspace.dependencies]
client = { path = "vendor/fr-client-rust/crates/client" }

[patch.crates-io]
dear-imgui-wgpu = { path = "vendor/dear-imgui-wgpu-0.15.1" }

# Pix3D is a software 3D painter. Unoptimized debug `cargo run` pins a core
# and looks like a hung client. Optimize that crate even in dev; bot crates
# stay unoptimized so TDD rebuilds stay cheap.
[profile.dev.package.client]
opt-level = 3

# Route searches over the real pack dominate nav and real-pack tests. At
# opt-level 0 the full `cargo test -p nav-planner` took a median 334 s; at 3 it took
# 30 s (release: 28 s). A nav edit then rebuilding `script` tests cost +4 s
# (27 -> 31 s). Measured 2026-10-08, MEASURE-NAV-OPT.
[profile.dev.package.nav-planner]
opt-level = 3

# The extracted producers retain the planner's dev optimization level.
[profile.dev.package.nav-bake]
opt-level = 3

# Debug info is most of `target/` and link work. Our crates keep file:line
# for panics and backtraces; third-party crates carry none and are lightly
# optimized (they rarely rebuild, and unoptimized wgpu/deno make debug runs
# and tests slow and memory-hungry).
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
opt-level = 1

# host-play's build script bakes navigation through the `nav-bake` crate.
# Build scripts default to opt-level 0, which made a bake take about 46 s instead
# of 9 s (measured 2026-10-05); the baked files are byte-identical either way.
# Registry build deps in dev still get `package."*"` above, which takes precedence.
[profile.dev.build-override]
opt-level = 3

[profile.release.build-override]
opt-level = 3
