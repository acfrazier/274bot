name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  # GitHub runners have no canonical 289 engine/content tree, so the build
  # stages no navigation bundle (checked-in identities only). Release builds
  # and LIVE runs keep the default `require` on machines with the inputs.
  BOT_NAV_BUILD: skip
  # Every test binary links V8; with debuginfo the host + client test builds
  # outgrow the runner disk.
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"

# GitHub is a subset of local CI (see CONTRIBUTING.md): no LIVE=1, no GPU
# adapter (SKIP_GPU=1). The cargo graph is the same as local — host workspace
# plus vendor/fr-client-rust — once ALSA/X11 headers are present. ubuntu-24.04
# does not ship libasound; panel enables client `audio` (cpal → alsa-sys).

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: fmt-ubuntu-24.04
      - name: Check formatting
        run: |
          cargo fmt --all -- --check
          cargo fmt --all --manifest-path vendor/fr-client-rust/Cargo.toml -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy
      - name: Native libs (ALSA + window)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libasound2-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxrandr-dev
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: clippy-ubuntu-24.04
          cache-on-failure: true
          workspaces: |
            . -> target
            vendor/fr-client-rust -> target
      - name: Clippy
        run: |
          cargo clippy --workspace --all-targets --no-deps -- -D warnings
          cargo clippy --manifest-path vendor/fr-client-rust/Cargo.toml --workspace --all-targets --no-deps -- -D warnings
          cargo clippy -p host --all-targets --no-deps --features performance-profile -- -D warnings
          cargo clippy -p host --all-targets --no-deps --features render-diagnostics -- -D warnings
          cargo clippy -p panel --all-targets --no-deps --features memory-profile -- -D warnings
          cargo clippy -p panel --all-targets --no-deps --features render-diagnostics -- -D warnings
          cargo clippy -p host-play --all-targets --no-deps --features memory-profile -- -D warnings
          cargo clippy -p host-play --all-targets --no-deps --features memory-profile-no-alloc -- -D warnings
          cargo clippy -p tui --all-targets --no-deps --features memory-profile -- -D warnings
          cargo clippy -p script --no-default-features --all-targets --no-deps -- -D warnings

  architecture:
    name: architecture
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Check crate architecture
        run: |
          python3 --version
          python3 tools/architecture/check.py
          python3 tools/architecture/check.py --self-test
          python3 tools/schema/isolate_snapshot_check.py
          python3 tools/schema/isolate_snapshot_check.py --self-test

  test_lanes:
    name: test (${{ matrix.lane }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: workspace
            free_disk: true
            cache_key: workspace
            save_cache: true
            os: ubuntu-24.04
            command: "cargo test --workspace"
          - lane: vendor
            free_disk: false
            cache_key: vendor
            save_cache: true
            os: ubuntu-24.04
            command: "cargo test --manifest-path vendor/fr-client-rust/Cargo.toml --workspace"
          - lane: script-load
            free_disk: false
            cache_key: workspace
            save_cache: false
            os: ubuntu-24.04
            command: "cargo test -p script --features load --tests"
          - lane: script-no-default
            free_disk: false
            cache_key: workspace
            save_cache: false
            os: ubuntu-24.04
            command: "cargo test -p script --no-default-features"
          - lane: host-play-memory
            free_disk: false
            cache_key: workspace
            save_cache: false
            os: ubuntu-24.04
            command: "cargo test -p host-play --features memory-profile"
          - lane: host-play-memory-no-alloc
            free_disk: false
            cache_key: workspace
            save_cache: false
            os: ubuntu-24.04
            command: "cargo test -p host-play --features memory-profile-no-alloc --lib"
          - lane: host-performance
            free_disk: false
            cache_key: workspace
            save_cache: false
            os: ubuntu-24.04
            command: "cargo test -p host --features performance-profile"
          - lane: panel-memory
            free_disk: false
            cache_key: workspace
            save_cache: false
            os: ubuntu-24.04
            command: "cargo test -p panel --features memory-profile"
          - lane: panel-render-diagnostics
            free_disk: false
            cache_key: workspace
            save_cache: false
            os: ubuntu-24.04
            command: "cargo test -p panel --features render-diagnostics --lib"
          - lane: tui-memory
            free_disk: false
            cache_key: workspace
            save_cache: false
            os: ubuntu-24.04
            command: "cargo test -p tui --features memory-profile"
          - lane: host-play-memory-26.04
            os: ubuntu-26.04
            free_disk: false
            cache_key: workspace
            save_cache: true
            command: "cargo test -p host-play --features memory-profile"
    runs-on: ${{ matrix.os }}
    env:
      SKIP_GPU: "1"
    steps:
      - name: Free runner disk
        if: ${{ matrix.free_disk }}
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@1.98.0
      - name: Native libs (ALSA + window)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libasound2-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxrandr-dev
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-${{ matrix.os }}-${{ matrix.cache_key }}
          cache-on-failure: true
          save-if: ${{ matrix.save_cache }}
          workspaces: |
            . -> target
            vendor/fr-client-rust -> target
      - name: Test ${{ matrix.lane }}
        run: ${{ matrix.command }}

  # Preserve the required `test` status while the expensive commands fan out.
  test:
    name: test
    if: ${{ always() }}
    needs: test_lanes
    runs-on: ubuntu-24.04
    steps:
      - name: Require every test lane
        env:
          LANES_RESULT: ${{ needs.test_lanes.result }}
        run: test "$LANES_RESULT" = success
