[package]
name = "panel"
version.workspace = true
edition = "2021"
publish = false

[dependencies]
api = { path = "../api" }
# `wayland-data-control`: on a Wayland desktop read and write the Wayland
# clipboard directly; without it arboard only reaches X11, whose clipboard is
# empty while a Wayland window has focus, so Ctrl+V never pasted.
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }
client = { workspace = true, features = ["audio"] }
dear-imgui-rs = "0.15"
dear-imgui-wgpu = "0.15"
dear-imgui-winit = "0.15"
frontend-core = { path = "../frontend-core", default-features = false, features = ["debug-catalog", "live-harness"] }
nav-planner = { path = "../nav-planner" }
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"
thiserror = "2"
wgpu = "29"
winit = "0.30"
pollster = "0.4"
png = "0.18"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
objc2 = "0.5.2"
objc2-foundation = { version = "0.2.2", features = ["NSArray", "NSGeometry", "NSThread"] }
objc2-app-kit = { version = "0.2.2", features = [
    "NSResponder",
    "NSScreen",
    "NSView",
    "NSWindow",
] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
] }

[[bin]]
name = "panel-play"
path = "src/main.rs"

[[example]]
name = "catalog_watch"
required-features = ["js"]

[[example]]
name = "pair_watch"
required-features = ["js"]

[[example]]
name = "external_watch"
required-features = ["js"]

[[example]]
name = "quester_skip"
required-features = ["js"]

# Winit requires the OS main thread on macOS, unlike libtest's worker threads.
[[test]]
name = "ime_frame"
path = "tests/ime_frame.rs"
harness = false

[features]
default = ["js"]
js = ["frontend-core/js"]
render-diagnostics = ["client/render-diagnostics", "frontend-core/render-diagnostics"]
memory-profile = ["frontend-core/memory-profile"]
# CPU diagnostic: use System directly, report allocator metrics unavailable.
memory-profile-no-alloc = ["memory-profile", "frontend-core/memory-profile-no-alloc"]

[dev-dependencies]
frontend-core = { path = "../frontend-core", default-features = false, features = ["test-support"] }
host-play = { path = "../host-play", default-features = false, features = ["live-probe"] }
nav-bake = { path = "../nav-bake" }
proc-macro2 = "1"
syn = "2"
parking_lot = "0.12"
