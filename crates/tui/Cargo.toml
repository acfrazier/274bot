[package]
name = "tui"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
api = { path = "../api" }
client = { workspace = true }
crossterm = "0.29"
host = { path = "../host" }
host-play = { path = "../host-play" }
nav = { path = "../nav" }
ratatui = "0.30"
scenario = { path = "../scenario" }
script = { path = "../script" }
serde_json = "=1.0.140"
vault = { path = "../vault" }

[dev-dependencies]

[[bin]]
name = "tui-play"
path = "src/main.rs"

[features]
memory-profile = ["host-play/memory-profile"]

# CPU diagnostic: use System directly, report allocator metrics unavailable.
memory-profile-no-alloc = ["memory-profile", "host-play/memory-profile-no-alloc"]
