name: CI

# Every job runs on pushes to main, dev and release/**, and on pull requests
# into main and dev. Outside contributors open pull requests against dev
# (CONTRIBUTING.md), so a pull request gets the full fmt, clippy, test and
# architecture checks before review.
on:
  push:
    branches: [main, dev, "release/**"]
  pull_request:
    branches: [main, dev]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # GitHub runners have no canonical 289 engine/content tree, so the build
  # stages no navigation bundle (checked-in identities only). Release builds
  # and LIVE runs keep the default `require` on machines with the inputs.
  BOT_NAV_BUILD: skip
  # Every test binary links V8; with debuginfo the host + client test builds
  # outgrow the runner disk.
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  # The reviewed v18 reference is published separately from application releases.
  # Main and the operator publish these immutable assets before this CI cutover.
  CI_NAV_PACK_RELEASE: "nav-reference-v18"
  CI_NAV_PACK_SHA256: 81e5ca84568b4e3d9b0e7f428a2d43d5e945c73cd74910645db626c89bd4de36
  CI_NAV_FLAGS_SHA256: 67e4094dff06def5cf8abc172ce751f4ca8679532ba04c1ba15ab6bf668c7a4a

# GitHub is a subset of local CI (see CONTRIBUTING.md): no LIVE=1, no GPU
# adapter (SKIP_GPU=1). The cargo graph is the same as local — host workspace
# plus vendor/fr-client-rust — once ALSA/X11 headers are present. ubuntu-24.04
# does not ship libasound; panel enables client `audio` (cpal → alsa-sys).

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: fmt-ubuntu-24.04
      - name: Check formatting
        run: cargo run --locked -p xtask -- ci fmt
      - name: Check formatting
        run: cargo run --locked -p xtask -- ci fmt-client
      - name: Lint suppression ratchet
        run: cargo run --locked -p xtask -- ci ratchet-selftest
      - name: Lint suppression ratchet
        run: cargo run --locked -p xtask -- ci ratchet
      - name: Docs check
        run: cargo run --locked -p xtask -- ci docs-check-selftest
      - name: Docs check
        run: cargo run --locked -p xtask -- ci docs-check
      - name: ci-self-check
        run: cargo run --locked -p xtask -- ci ci-self-check

  clippy:
    name: clippy
    if: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/heads/release/') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: clippy
      - name: Native libs (ALSA + window)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libasound2-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxrandr-dev
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: clippy-ubuntu-24.04
          cache-on-failure: true
          workspaces: |
            . -> target
            vendor/fr-client-rust -> target
      - name: Navigation action deny-list coverage
        run: cargo run --locked -p xtask -- ci nav-clippy
      - name: Clippy
        run: cargo run --locked -p xtask -- ci clippy-1
      - name: Clippy
        run: cargo run --locked -p xtask -- ci clippy-2
      - name: Clippy
        run: cargo run --locked -p xtask -- ci clippy-3
      - name: Clippy
        run: cargo run --locked -p xtask -- ci clippy-4
      - name: Clippy
        run: cargo run --locked -p xtask -- ci clippy-5
      - name: Clippy
        run: cargo run --locked -p xtask -- ci clippy-6
      - name: Clippy
        run: cargo run --locked -p xtask -- ci clippy-7
      - name: Clippy
        run: cargo run --locked -p xtask -- ci clippy-8
      - name: Clippy
        run: cargo run --locked -p xtask -- ci clippy-9
      - name: Clippy
        run: cargo run --locked -p xtask -- ci clippy-10
      - name: Clippy
        run: cargo run --locked -p xtask -- ci clippy-11
      - name: Clippy
        run: cargo run --locked -p xtask -- ci clippy-12
      - name: Clippy
        run: cargo run --locked -p xtask -- ci clippy-13

  architecture:
    name: architecture
    runs-on: ubuntu-24.04
    env:
      ARCH_RUST_ANALYZER_URL: ${{ vars.ARCH_RUST_ANALYZER_URL }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch pinned client submodule as data
        run: |
          set -euo pipefail
          expected_module_keys="$(printf '%s\n' 'submodule.vendor/fr-client-rust.branch' 'submodule.vendor/fr-client-rust.path' 'submodule.vendor/fr-client-rust.url')"
          actual_module_keys="$(git config --no-includes -f .gitmodules --name-only --list | sort)"
          test "$actual_module_keys" = "$expected_module_keys"
          test "$(git config --no-includes -f .gitmodules --get-all submodule.vendor/fr-client-rust.path)" = "vendor/fr-client-rust"
          test "$(git config --no-includes -f .gitmodules --get-all submodule.vendor/fr-client-rust.url)" = "https://github.com/acfrazier/FR-client-bothost.git"
          test "$(git config --no-includes -f .gitmodules --get-all submodule.vendor/fr-client-rust.branch)" = "multirev-bh-modular"
          GIT_ALLOW_PROTOCOL=https git submodule update --init -- vendor/fr-client-rust
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.14.8"
          check-latest: false
      - name: Run operator-owned architecture check
        run: cargo run --locked -p xtask -- ci arch-selftest
      - name: Run operator-owned architecture check
        run: cargo run --locked -p xtask -- ci arch
      - name: Check FlatBuffer bindings
        run: cargo run --locked -p xtask -- ci flatbuffers

  test_lanes:
    name: test (${{ matrix.lane }})
    if: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/heads/release/') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: workspace
            free_disk: true
            cache_key: workspace
            save_cache: true
            real_nav_pack: true
            os: ubuntu-24.04
          - lane: vendor
            free_disk: false
            cache_key: vendor
            save_cache: true
            os: ubuntu-24.04
          - lane: script-load
            free_disk: false
            cache_key: workspace
            save_cache: false
            real_nav_pack: true
            os: ubuntu-24.04
          - lane: script-no-default
            free_disk: false
            cache_key: workspace
            save_cache: false
            real_nav_pack: true
            os: ubuntu-24.04
          - lane: native-only
            free_disk: false
            cache_key: workspace
            save_cache: false
            real_nav_pack: true
            os: ubuntu-24.04
          - lane: grinch-oracles
            free_disk: false
            cache_key: workspace
            save_cache: false
            os: ubuntu-24.04
          - lane: host-play-memory
            free_disk: false
            cache_key: workspace
            save_cache: false
            os: ubuntu-24.04
          - lane: host-play-memory-no-alloc
            free_disk: false
            cache_key: workspace
            save_cache: false
            os: ubuntu-24.04
          - lane: host-performance
            free_disk: false
            cache_key: workspace
            save_cache: false
            os: ubuntu-24.04
          - lane: panel-memory
            free_disk: false
            cache_key: workspace
            save_cache: false
            real_nav_pack: true
            os: ubuntu-24.04
          - lane: panel-render-diagnostics
            free_disk: false
            cache_key: workspace
            save_cache: false
            os: ubuntu-24.04
          - lane: tui-memory
            free_disk: false
            cache_key: workspace
            save_cache: false
            os: ubuntu-24.04
          - lane: host-play-memory-26.04
            os: ubuntu-26.04
            free_disk: false
            cache_key: workspace
            save_cache: true
          - lane: vendor-render-test-hooks
            free_disk: false
            cache_key: vendor
            save_cache: true
            os: ubuntu-24.04
          - lane: host-render-test-hooks
            free_disk: false
            cache_key: workspace
            save_cache: false
            os: ubuntu-24.04
    runs-on: ${{ matrix.os }}
    env:
      SKIP_GPU: "1"
    steps:
      - name: Free runner disk
        if: ${{ matrix.free_disk }}
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@1.98.1
      - name: Native libs (ALSA + window)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libasound2-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-0 \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxrandr-dev \
            xvfb
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-${{ matrix.os }}-${{ matrix.cache_key }}
          cache-on-failure: true
          save-if: ${{ matrix.save_cache }}
          workspaces: |
            . -> target
            vendor/fr-client-rust -> target
      - name: Cache the 289 nav pack
        if: ${{ matrix.real_nav_pack }}
        id: nav-pack-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/nav-289
          key: nav-289-${{ env.CI_NAV_PACK_SHA256 }}
      - name: Fetch the 289 nav pack
        if: ${{ matrix.real_nav_pack && steps.nav-pack-cache.outputs.cache-hit != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/nav-289"
          gh release download "$CI_NAV_PACK_RELEASE" -R "$GITHUB_REPOSITORY" \
            -p "274bot-289-v18.navpack" -p "274bot-289-v18.navflags" \
            -D "$RUNNER_TEMP/nav-289"
      - name: Use the 289 nav pack
        if: ${{ matrix.real_nav_pack }}
        run: |
          echo "$CI_NAV_PACK_SHA256  $RUNNER_TEMP/nav-289/274bot-289-v18.navpack" | sha256sum -c -
          echo "$CI_NAV_FLAGS_SHA256  $RUNNER_TEMP/nav-289/274bot-289-v18.navflags" | sha256sum -c -
          echo "NAV_PACK=$RUNNER_TEMP/nav-289/274bot-289-v18.navpack" >> "$GITHUB_ENV"
          echo "WORLD_NAV_PACK=$RUNNER_TEMP/nav-289/274bot-289-v18.navpack" >> "$GITHUB_ENV"
          echo "NAV_ARRIVAL_PACK=$RUNNER_TEMP/nav-289/274bot-289-v18.navpack" >> "$GITHUB_ENV"
      - name: Test ${{ matrix.lane }}
        run: cargo run --locked -p xtask -- ci test-${{ matrix.lane }}

  # Preserve the required `test` status while the expensive commands fan out.
  test:
    name: test
    if: ${{ always() && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/heads/release/')) }}
    needs: test_lanes
    runs-on: ubuntu-24.04
    steps:
      - name: Require every test lane
        env:
          LANES_RESULT: ${{ needs.test_lanes.result }}
        run: test "$LANES_RESULT" = success
