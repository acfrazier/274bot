[live]
globs = [
  "Cargo.toml",
  "Cargo.lock",
  "**/Cargo.toml",
  "**/build.rs",
  "crates/api/src/**",
  "crates/api/data/**",
  "crates/host/src/**",
  "crates/host-play/src/**",
  "crates/host-play/tests/survivable_admission_live.rs",
  "crates/frontend-core/src/**",
  "crates/panel/src/**",
  "crates/panel/assets/**",
  "crates/tui/src/**",
  "crates/nav-planner/src/**",
  "crates/nav-executor/src/**",
  "crates/script/src/**",
  "crates/script-js/src/**",
  "crates/script-js/examples/guardian_claim_toggle.js",
  "crates/script-js/examples/combat_showcase_v2.ts",
  "crates/script/fonts/**",
  "crates/script-js/compat-js/*.json",
  "crates/script-js/compat-js/*.d.ts",
  "crates/script-js/host-js/**",
  "crates/script-js/schema/**",
  "crates/script/paths/**",
  "crates/scenario/src/**",
  "crates/vault/src/**",
  "vendor/fr-client-rust",
  "vendor/fr-client-rust/crates/client/src/**",
  "vendor/dear-imgui-wgpu-0.15.1/**",
]

[not_live]
globs = [
  "docs/**",
  ".github/**",
  "tools/**",
  "crates/e2e/**",
  "crates/script-js/src/tooling/compat_dts.rs",
  "crates/host-play/src/bank_core_live.rs",
  "crates/host-play/src/bank_fetch_closed_live.rs",
  "crates/host-play/src/bank_memory_live.rs",
  "crates/host-play/src/gather_bait_live.rs",
  "crates/host-play/src/gather_held_live.rs",
  "crates/host-play/src/gather_return_live.rs",
  "crates/host-play/src/gatherer_recovery_live.rs",
  "**/tests/**",
  "**/benches/**",
  "**/*_tests.rs",
  "**/*_test.rs",
  "**/test_support/**",
  "crates/panel/src/test_support.rs",
  "**/fixtures/**",
  "**/tests.rs",
  "**/test.rs",
  "**/*.test.ts",
  "**/*.spec.ts",
  "**/package.json",
  "**/package-lock.json",
  "**/clippy.toml",
  "**/*.md",
  "**/*.conf",
  "**/*.yml",
  "**/*.yaml",
  "**/*.cjs",
  ".gitignore",
  ".gitmodules",
]

exceptions = ["crates/host-play/tests/survivable_admission_live.rs"]

# Fleet Stop enters the shared command plan, retires the host's script walk,
# and projects the resulting rows. See README.md "State-gap and refusal paths".
[[cover]]
globs = ["crates/frontend-core/src/bot_projection.rs", "crates/frontend-core/src/fleet.rs", "crates/frontend-core/src/selection.rs", "crates/frontend-core/src/session/fleet_plan.rs", "crates/frontend-core/src/views.rs", "crates/host-play/src/play_scripts.rs", "crates/host-play/src/script_runtime.rs", "crates/host-play/src/play_slots.rs", "crates/host-play/src/script_nav.rs", "crates/host-play/src/script_walk.rs", "crates/panel/src/session.rs", "crates/panel/src/fleet.rs", "crates/panel/src/fleet_actions.rs"]
cells = [
  "panel.state-gap-stop-live|LIVE=1 BOT_LIVE_NAME_PREFIX=${BOT_LIVE_NAME_PREFIX:?} BOT_CPU=1 BOT_NAV_BUILD=skip MANUAL_LIVE_EVIDENCE=${LIVE_EVIDENCE_DIR:?} WORLD_ENGINE_DIR=${ENGINE_A_DIR:?} WORLD_NAV_PACK=${NAV_PACK_289:?} ISOHOME_DIR=${PANEL_LIVE_HOME:?} ${ISOHOME:?} nice -n 10 cargo test --locked -p panel --lib -- --ignored --exact manual_click_live_tests::live_stop_retires_script_walks_and_keeps_the_manual_walk --nocapture --test-threads=1",
]

# Startup ordering and preference arrival use controlled real-session stores.
# These regressions complement the mapped game cells, not desktop interaction.
[[cover]]
globs = ["crates/frontend-core/src/profile_order.rs", "crates/frontend-core/src/session.rs", "crates/panel/src/session.rs", "crates/tui/src/bin.rs"]
cells = [
  "frontend-core.startup-order-headless|${ISOHOME:?} nice -n 10 cargo test --locked -p frontend-core --lib o1_ -- --nocapture",
  "panel.startup-order-headless|${ISOHOME:?} nice -n 10 cargo test --locked -p panel --lib o1_ -- --nocapture",
  "tui.startup-order-headless|${ISOHOME:?} nice -n 10 cargo test --locked -p tui --lib o1_ -- --nocapture",
]

# Saved settings take effect from the durable snapshot, and a pending or failed
# save shows at its setting (T5.3-S3). The cells drive a held, then failed, disk
# through the headless driver, the panel session and dialogs, and the terminal
# app's popup at 120x40 and 80x24. See README.md "Saved settings".
[[cover]]
globs = ["crates/frontend-core/src/command.rs", "crates/frontend-core/src/log.rs", "crates/frontend-core/src/log_file.rs", "crates/frontend-core/src/map_bake.rs", "crates/frontend-core/src/prefs.rs", "crates/frontend-core/src/quester_paths.rs", "crates/frontend-core/src/session/prefs.rs", "crates/frontend-core/src/setting.rs", "crates/host-play/src/local_state.rs", "crates/host-play/src/local_state/frontend.rs", "crates/panel/src/fleet_toolbar.rs", "crates/panel/src/log_pane.rs", "crates/panel/src/picker.rs", "crates/panel/src/ui_state.rs", "crates/panel/src/wall.rs", "crates/tui/src/lib.rs", "crates/tui/src/settings.rs", "crates/tui/src/shell.rs"]
cells = [
  "frontend-core.driver-command-headless|${ISOHOME:?} nice -n 10 cargo test --locked -p frontend-core --lib driver::tests::",
  "host-play.local-state-headless|${ISOHOME:?} nice -n 10 cargo test --locked -p host-play --lib local_state::",
  "panel.settings-feedback-headless|${ISOHOME:?} nice -n 10 cargo test --locked -p panel --lib settings_feedback_",
  "tui.settings-feedback-headless|${ISOHOME:?} nice -n 10 cargo test --locked -p tui --lib settings_feedback_",
]

# These UI paths have controlled-state driver proof, not game-world fixtures.
[[cover]]
globs = ["crates/frontend-core/src/error_expiry.rs", "crates/frontend-core/src/lib.rs", "crates/frontend-core/src/session/commands.rs"]
cells = [
  "frontend-core.driver-command-headless|${ISOHOME:?} nice -n 10 cargo test --locked -p frontend-core --lib driver::tests::",
  "frontend-core.error-expiry-headless|${ISOHOME:?} nice -n 10 cargo test --locked -p frontend-core --lib error_expiry::tests::",
]

# The login notice: a failed login kept apart from the phase until a login,
# a newer failure or the shared timeout. The poll (session.rs) projects it and
# both front ends show it. The refused cell runs real slot workers against the
# refused endpoint 127.0.0.1:1 on the wall clock; the headless cells drive
# controlled host rows. See README.md "Login notice".
[[cover]]
globs = ["crates/frontend-core/src/login_notice.rs", "crates/frontend-core/src/session.rs", "crates/tui/src/status.rs"]
cells = [
  "frontend-core.login-notice-refused|${ISOHOME:?} nice -n 10 cargo test --locked -p frontend-core --test login_notice_refused -- --ignored --nocapture",
  "frontend-core.login-notice-headless|${ISOHOME:?} nice -n 10 cargo test --locked -p frontend-core --lib login_notice",
  "tui.login-notice-headless|${ISOHOME:?} nice -n 10 cargo test --locked -p tui --lib login_notice",
  "panel.login-notice-headless|${ISOHOME:?} nice -n 10 cargo test --locked -p panel --lib login_notice",
]

# Log out of a bot whose login keeps retrying: one projection of who Log out
# acts on (`LogoutEligibility`) feeds the panel button, the TUI command and
# Fleet. The cell runs a real slot worker against a local listener that
# closes every connection, counts the attempts on the wire, and checks that
# none arrives after Log out (single command and Fleet plan). See README.md
# "Log out of a retrying login".
[[cover]]
globs = ["crates/frontend-core/src/bot_projection.rs", "crates/frontend-core/src/slot_view.rs", "crates/panel/src/app.rs", "crates/tui/src/app.rs"]
cells = [
  "frontend-core.logout-retry-refused|${ISOHOME:?} nice -n 10 cargo test --locked -p frontend-core --test logout_retry_refused -- --ignored --nocapture",
  "frontend-core.logout-retry-headless|${ISOHOME:?} nice -n 10 cargo test --locked -p frontend-core --lib logout_retry",
  "tui.logout-retry-headless|TUI_CAPTURE_DIR=${LIVE_EVIDENCE_DIR:?}/tui ${ISOHOME:?} nice -n 10 cargo test --locked -p tui --lib logout_retry",
  "panel.logout-retry-headless|${ISOHOME:?} nice -n 10 cargo test --locked -p panel --lib logout_retry",
]

