# Saved settings take effect from the durable snapshot, and a pending or failed
# save shows at its setting (T5.3-S3). The cells drive a held, then failed, disk
# through the headless driver, the panel session and dialogs, and the terminal
# app's popup at 120x40 and 80x24. See README.md "Saved settings".
[[cover]]
globs = ["crates/frontend-core/src/command.rs", "crates/frontend-core/src/log.rs", "crates/frontend-core/src/log_file.rs", "crates/frontend-core/src/map_bake.rs", "crates/frontend-core/src/nav_prefs.rs", "crates/frontend-core/src/prefs.rs", "crates/frontend-core/src/quester_paths.rs", "crates/frontend-core/src/session/prefs.rs", "crates/frontend-core/src/setting.rs", "crates/frontend-core/src/walk_permissions.rs", "crates/host-play/src/local_state.rs", "crates/host-play/src/local_state/files.rs", "crates/host-play/src/local_state/frontend.rs", "crates/panel/src/fleet_toolbar.rs", "crates/panel/src/log_pane.rs", "crates/panel/src/nav_settings.rs", "crates/panel/src/picker.rs", "crates/panel/src/ui_state.rs", "crates/panel/src/wall.rs", "crates/tui/src/lib.rs", "crates/tui/src/script_params.rs", "crates/tui/src/settings.rs", "crates/tui/src/shell.rs"]
cells = [
  "frontend-core.driver-command-headless|${ISOHOME:?} nice -n 10 cargo test --locked -p frontend-core --lib driver::tests::",
  "host-play.local-state-headless|${ISOHOME:?} nice -n 10 cargo test --locked -p host-play --lib local_state::",
