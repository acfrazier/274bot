[package]
name = "panel"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
api = { path = "../api" }
client = { workspace = true }
dear-app = "0.15.1"
dear-imgui-rs = "0.15"
host = { path = "../host" }
host-play = { path = "../host-play" }
nav = { path = "../nav" }
scenario = { path = "../scenario" }
script = { path = "../script" }
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"
vault = { path = "../vault" }
wgpu = "29"
winit = "0.30"

[[bin]]
name = "panel-play"
path = "src/main.rs"
