[[item]]
id = "survival-unknown-poison-worst-case"
kind = "known-issue"
area = "Scripts"
text = """When the game reports poison and the bot cannot see which creature
  poisoned it, when the poison message and the creatures' update arrived
  together so the bot cannot tell which game tick the message belongs to, or
  when a poisoned bot takes any hit, the bot assumes the strongest poison in the
  game (330 damage) until the next poison tick shows the real value. Each poison
  tick then shows the true remaining value. A bot with a cure may drink it
  earlier than it strictly needed to. A script with no cure held can pause on a
  poison it would have survived. The pause ends within five poison ticks (about
  150 game ticks) of the first poison tick at which the bot's hitpoints and food
  would have carried it through, which can be later than the message when the
  bot is eating as it waits, and then the script continues on its own."""
first = "0.2.7"
listed = "0.2.9"
target = "0.3.0"
severity = "low"
owner = "T2 survival"

[[item]]
id = "survival-poison-line-waits-for-creatures"
kind = "known-issue"
area = "Scripts"
text = """When the game reports poison in a frame before its creatures' update, the
  bot waits for that update before it decides which creature poisoned it. A
  cure that is needed only for the worst case is then drunk one game tick
  later. A cure that is needed at once is drunk at once."""
first = "0.2.7"
listed = "0.2.9"
target = "0.3.0"
severity = "low"
owner = "T2 survival"

[[item]]
