first = "0.2.3"
target = "0.2.5"
fixed = "0.2.5"
severity = "medium"
owner = "scripts-misc"

[[item]]
id = "panel-linux-dual-gpu"
kind = "known-issue"
area = "Panel (Linux)"
text = """on a desktop with two graphics chips (for example a Ryzen with built-in
  graphics plus a separate graphics card), the panel can close right after it
  starts with "importing the supplied dmabufs failed". Start it with
  `WGPU_POWER_PREF=high ./panel-play` until this is fixed."""
first = "0.2.0.2"
target = "none"
severity = "high"
owner = "dual-gpu"

[[item]]
id = "survivable-acts-as-never"
kind = "known-issue"
area = "Navigation"
text = """With the default Danger routing setting, **When survivable**, bots can
  refuse walks and bank trips through dangerous monsters instead of checking
  whether the account can survive the trip. For example, a bot at Rock Crabs
  can report that no bank is reachable instead of walking to Seers' Village.
  **Workaround:** set Nav → Danger routing to **Always** (allow danger zones).
  This permits dangerous routes. Use it only when the account can handle the
  monsters on the route."""
first = "0.2.0"
listed = "0.2.5"
target = "0.2.6"
severity = "medium"
owner = "S2c"

