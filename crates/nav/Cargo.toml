[package]
name = "nav"
version.workspace = true
edition = "2021"
publish = false

[features]
test-support = []

[dependencies]
api = { path = "../api" }
client = { workspace = true }
thiserror = "=2.0.20"
serde = { version = "=1.0.219", features = ["derive"] }
png = "=0.18.1"
serde_json = "=1.0.140"
sha2 = "=0.10.9"

[dev-dependencies]
allocation-counter = "=0.8.1"

[[bin]]
name = "nav-pack"
path = "src/bin/nav-pack.rs"

[[bin]]
name = "cache-content-id"
path = "src/bin/cache-content-id.rs"
