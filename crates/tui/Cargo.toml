[package]
name = "tui"
version.workspace = true
edition = "2021"
publish = false

[dependencies]
api = { path = "../api" }
client = { workspace = true }
# `use-dev-tty`: see host-play's crossterm entry (a burst over 1 KiB, such as
# a paste, is read whole instead of stalling until the next key).
crossterm = { version = "0.29", features = ["use-dev-tty"] }
frontend-core = { path = "../frontend-core", default-features = false, features = ["live-harness"] }
libc = "0.2"
nav-planner = { path = "../nav-planner" }
ratatui = "0.30"
serde_json = "=1.0.140"

[dev-dependencies]
api = { path = "../api", features = ["test-support"] }
frontend-core = { path = "../frontend-core", default-features = false, features = ["test-support"] }
host = { path = "../host" }
host-play = { path = "../host-play", default-features = false, features = ["test-support", "live-probe"] }
nav-bake = { path = "../nav-bake" }

[[bin]]
name = "tui-play"
path = "src/main.rs"

[features]
default = ["js"]
js = ["frontend-core/js"]
memory-profile = ["frontend-core/memory-profile"]

# CPU diagnostic: use System directly, report allocator metrics unavailable.
memory-profile-no-alloc = ["memory-profile", "frontend-core/memory-profile-no-alloc"]
