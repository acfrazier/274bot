  bot does not drink a held cure for that poison and does not eat early for
  it. A bot whose hitpoints are at or below one poison tick's damage can die in
  that tick."""
first = "0.2.7"
listed = "0.2.9"
target = "none"
severity = "medium"
owner = "T2 survival"

