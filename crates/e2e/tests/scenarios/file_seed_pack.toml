# Reviewed own-account pack for the File seed-pack cell (LD2 §8.4).
# `give` adds to the caller's carried inventory (ClientCheatHandler `give`).
version = 1

[[operations]]
name = "give_item"
template = "give {item} {count}"
effects = ["adds count of the named item to the caller's carried inventory"]
precondition = "none"
scope = "own-account"
confirm = { state = [{ kind = "item_count", item = "coins", container = "carried", count = 5 }] }

[operations.params.item]
kind = "name"
table = "item"

[operations.params.count]
kind = "int"
min = 1
max = 5
