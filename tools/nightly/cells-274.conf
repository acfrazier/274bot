# Cells the revision-274 nightly lane runs (zinfandel), one per line.
# The runner reads this file through --cells-file (NIGHTLY_CELLS_FILE).
# A name that is not in the catalog fails the run. Nothing is dropped
# without a word.
#
# How this list is chosen (NIGHTLY-274, 2026-10-20):
#
# The catalog has no revision field. A cell implies a revision through
# the content it touches and the game data its oracle loads. This list
# keeps the revision-neutral breadth of the catalog: one or two cells
# per family. Every cell here passed on the 289 production lane on
# 2026-10-19 (run 2026-10-19-dev-d28b2366b: 244 cells, 188 PASS). A
# failure on 274 is then a revision signal, not a known 289 failure.
#
# Not in this list, with the reason:
#
# - The rest of each family: depth. The lane needs breadth, and the
#   night must stay under about 3 hours.
# - Cells that did not pass on 289 in that run (FAIL, TIMEOUT, ERROR):
#   their 274 result would not separate a revision defect from the
#   known 289 one. This removes, among others, the 3600 s timeouts
#   (brimhaven_agility, wildy_agility, clue_duel_3554,
#   herblore_secondaries_newt, auto_fighter_mage, auto_fighter_range),
#   the fire_giant and mule families, and the nav/shops cells that
#   fail on 289 today.
# - The quester_ family (9 cells): the Quester loads revision-289
#   game data without a revision choice (crates/scenario/src/
#   quester.rs), so a 274 result cannot be read as product signal.
#   Add quester_cook here when the Quester selects its data by the
#   launch profile's revision. quester_path is also in skip.conf.
#
# Two families carry a 289 assumption the reader must know. The
# guardian_ cells need the engine test patches in
# tools/engine-patches/274 (the 274 twins of the 289 patches). Without
# them the skill cells report UNAVAILABLE, never a plain FAIL. The
# random-event oracle loads revision-289 NPC data for its evade range
# (crates/scenario/src/runner.rs), so a guardian failure on 274 is
# classified before it is believed.
#
# The 289 wall sum of this list was 6005 s on 2026-10-19 (about
# 25 min at 4 in parallel). The lane caps each cell at 900 s and the
# night at 9000 s, so a bad 274 night still ends on time.

