[[item]]
id = "windows-map-bake-resume"
kind = "not-in-release"
area = "Map bake (Windows)"
text = """On Windows, resuming a local map bake that stopped part-way (for example
  after a crash) and left a damaged tile can fail with "Access is denied"
  instead of repairing the tile. Release packages ship the baked map, so this
  affects only self-built copies and local bakes. A fix is planned for 0.2.5."""
first = "0.2.4"
target = "0.2.5"
fixed = "0.2.5"
severity = "low"
owner = "windows"

[[item]]
id = "gatherer-catherby-obelisk"
kind = "known-issue"
