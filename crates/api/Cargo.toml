[package]
name = "api"
version.workspace = true
edition = "2021"
publish = false

[features]
debug-catalog = []
path-schema = ["dep:schemars"]
test-hooks = []
# Raw packet recorders for tests only. Product dependencies must not enable this.
test-support = []

[dependencies]
client = { workspace = true }
flate2 = "=1.1.9"
parking_lot = "0.12"
serde = { version = "=1.0.219", features = ["derive", "rc"] }
schemars = { version = "=1.2.2", optional = true }
serde_json = "=1.0.140"
sha2 = "=0.10.9"
smallvec = "=1.15.2"
thiserror = "=2.0.20"

[dev-dependencies]
api = { path = ".", features = ["test-support"] }
allocation-counter = "=0.8.1"

[build-dependencies]
flate2 = "=1.1.9"
