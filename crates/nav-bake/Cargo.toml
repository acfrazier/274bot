[package]
name = "nav-bake"
version.workspace = true
edition = "2021"
publish = false

[lints]
workspace = true

[dependencies]
api = { path = "../api", default-features = false }
nav-planner = { path = "../nav-planner" }
client = { workspace = true }
thiserror = "2.0.20"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"

[dev-dependencies]
api = { path = "../api", default-features = false, features = ["embedded-game-data"] }
allocation-counter = "0.8.1"

[[bin]]
name = "nav-pack"
path = "src/bin/nav-pack.rs"

