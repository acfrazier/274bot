[[item]]
id = "manual-movement-only-while-walking"
kind = "known-issue"
area = "Scripts"
text = """A script notices that you moved the bot yourself only while it is
  walking, or while an rs2b0t script runs a Gather or Combat session. If you
  move the bot while it fights or gathers in place, "Pause script on manual
  movement" does not pause the script, the script does not stop, and it
  carries on. A Quester fight notices your movement only when the fight began
  with a walk to its spot."""
first = "0.2.0"
listed = "0.2.5"
fixed = "0.2.6"
target = "none"
severity = "medium"
owner = "T2.rest native family rewrites"

[[item]]
id = "manual-movement-in-place-limits"
kind = "known-issue"
area = "Scripts"
text = """With "Pause script on manual movement" off, a script that acts in place
  can continue after you move the bot yourself. This affects rs2b0t scripts
  without a Gather or Combat session and built-in scripts other than Quester
  fights. With the setting on, any running rs2b0t script pauses. A built-in
  script pauses while it walks or acts, but not between actions."""
first = "0.2.6"
target = "none"
severity = "medium"
owner = "T2.rest native family rewrites"

[[item]]
id = "flaxrunner-spinner-bank-checks"
kind = "known-issue"
area = "Scripts"
text = """In the FlaxRunner script, the Spinner banking step does not check whether
  the walk to the Seers' Village bank or the bank opening succeeded before it
  tries to deposit. If either step fails once, the deposit does nothing for
  that trip and the trip counter still increases. The script retries on the
  next loop, so work continues, but a trip can be wasted. The fix belongs to
  the upstream script."""
first = "0.2.5"
fixed = "0.2.7"
target = "none"
severity = "low"
owner = "upstream rs2b0t FlaxRunner"

[[item]]
id = "herblore-secondaries-low-hp-starve"
kind = "known-issue"
area = "Scripts"
text = """The rs2b0t HerbloreSecondaries script does not eat while it walks, and its
  eat rule refuses a lobster above 5 hitpoints because the 12-point heal does
  not fit a low-Hitpoints account. On a low-level account the red spiders'
  eggs trip through Edgeville dungeon can kill the bot with food still in its
  pack. Run this script on an account with mid-level combat stats (the
  script's own tests use level 40) until the script is fixed upstream."""
first = "0.2.5"
fixed = "0.2.7"
target = "none"
severity = "medium"
owner = "scripts-misc"

[[item]]
id = "gnome-magic-chopper-north-bank-stair"
kind = "known-issue"
area = "Scripts"
text = """The rs2b0t GnomeMagicChopper script looks for the Gnome Stronghold
  bank's north staircase in the wrong place, a few tiles from the real
  stairs. If its first walk to the bank fails and it switches to the north
  staircase, that bank trip can fail. The south staircase works, and the
  script usually recovers on a later trip. If a fletching bank trip gets
  stuck, move the bot beside the south staircase and restart the script.
  The fix belongs to the upstream script."""
first = "0.2.5"
fixed = "0.2.7"
target = "none"
severity = "low"
owner = "scripts-misc"

