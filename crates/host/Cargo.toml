[package]
name = "host"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
api = { path = "../api" }
client = { workspace = true }
num-bigint = "0.4"
vault = { path = "../vault" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Networking_WinSock"] }
