[package]
name = "host-play"
version.workspace = true
edition = "2021"
publish = false

[dependencies]
api = { path = "../api" }
client = { workspace = true }
host = { path = "../host" }
nav = { path = "../nav" }
scenario = { path = "../scenario", optional = true }
script = { path = "../script", features = ["load"] }
serde_json = "=1.0.140"
serde = { version = "=1.0.219", features = ["derive"] }
sha2 = "=0.10.9"
libc = "0.2"
# The hidden passphrase prompt (`passphrase::read_hidden`) reads keys in raw
# mode, so nothing typed is echoed; same version the tui already builds.
crossterm = "0.29"
zeroize = "=1.9.0"
vault = { path = "../vault" }
rand_core = { version = "=0.6.4", features = ["getrandom"] }
parking_lot = "0.12"

# The build script bakes/stages the selected revision's navigation artifact
# and publishes its identities to the compile-time table (`nav_identity`).
[build-dependencies]
nav = { path = "../nav" }
serde_json = "=1.0.140"

[dev-dependencies]
bzip2 = "0.4"
png = "=0.18.1"
script = { path = "../script", features = ["test-hooks"] }

# These harnesses use the optional scenario runner even for their offline tests.
[[test]]
name = "catalog_boundary_live"
required-features = ["memory-profile"]

[[test]]
name = "world_boundary_live"
required-features = ["memory-profile"]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
] }

[features]
debug-catalog = ["api/debug-catalog"]
# Opt-in memory benchmark harness. No effect unless BOT_MEMORY_N is set.
# Frontend binaries install CountingAllocator (T3).
memory-profile = ["script/memory-profile", "host/performance-profile", "dep:scenario"]

# CPU diagnostic: use System directly, report allocator metrics unavailable.
memory-profile-no-alloc = ["memory-profile"]

# The live harness's fleet launch (`live_start::fleet_catalog_starts`),
# shared by panel-play and tui-play.
live-harness = ["dep:scenario"]

# Test-only Play fixtures. Enabled from frontend dev-dependencies, never
# production builds.
test-support = ["script/test-hooks"]

# Windows-only headed Quester journal paint proof. The code remains gated by
# both this feature and `cfg(windows)` so ordinary Mac/headless tests never
# construct a native window.
journal-paint-proof = ["client/headed-fixture", "host/journal-paint-proof"]
