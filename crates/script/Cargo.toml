[package]
name = "script"
version.workspace = true
edition = "2021"
publish = false

[features]
# Opt-in counters for the host-play memory-profile harness (V8 heap /
# snapshot inflight). Isolate hooks compile only with this feature.
memory-profile = []
# rustyscript pulls V8 into the build; `load` gates the JS isolate so
# crates that only need compiled scripts stay V8-free. On for script tests
# (they exercise Load) and for panel/host-play; nothing else depends on
# this crate.
default = ["load"]
load = ["dep:rustyscript", "dep:v8", "deno_ast/transpiling", "dep:flatbuffers", "dep:tiny-skia"]

[dependencies]
ab_glyph = "=0.2.32"
api = { path = "../api" }
# TS parse for import scans (always, V8-free); `load` adds the TS -> JS
# strip for the catalog shape. `transpiling` unifies with the features
# rustyscript already enables, so no new build graph.
deno_ast = { version = "=0.49.0" }
# Isolate IPC wire format (schema: `crates/script/schema/isolate.fbs`);
# the builder/reader are hand-written against it, so no `flatc` is needed.
flatbuffers = { version = "=25.12.19", optional = true }
rustyscript = { version = "=0.12.3", optional = true }
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"
sha2 = "=0.10.9"
# Direct raster dependency for path/clip/linear-gradient. 0.11.4 `simd`
# is an empty feature (no `wide` crate); `png-format` is not selected.
tiny-skia = { version = "=0.11.4", default-features = false, features = ["std", "simd"], optional = true }
vault = { path = "../vault" }
v8 = { version = "=137.2.1", default-features = false, optional = true }

[dev-dependencies]
# The ctx unit test builds an `ObjType` table; the compiled crate itself
# never touches `client`.
client = { workspace = true }
# Catalog geometry fixtures use the native resolver; the compiled crate
# itself never depends on nav.
nav = { path = "../nav" }
