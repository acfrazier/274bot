[package]
name = "panel"
version.workspace = true
edition = "2021"
publish = false

[dependencies]
api = { path = "../api" }
arboard = { version = "3", default-features = false }
client = { workspace = true, features = ["audio"] }
dear-imgui-rs = "0.15"
dear-imgui-wgpu = "0.15"
dear-imgui-winit = "0.15"
frontend-core = { path = "../frontend-core" }
host = { path = "../host" }
host-play = { path = "../host-play", features = ["live-harness", "debug-catalog"] }
nav = { path = "../nav" }
scenario = { path = "../scenario" }
script = { path = "../script" }
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"
thiserror = "2"
vault = { path = "../vault" }
wgpu = "29"
winit = "0.30"
pollster = "0.4"
png = "0.18"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
objc2 = "0.5.2"
objc2-foundation = { version = "0.2.2", features = ["NSArray", "NSGeometry", "NSThread"] }
objc2-app-kit = { version = "0.2.2", features = [
    "NSResponder",
    "NSScreen",
    "NSView",
    "NSWindow",
] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
] }

[[bin]]
name = "panel-play"
path = "src/main.rs"

# Winit requires the OS main thread on macOS, unlike libtest's worker threads.
[[test]]
name = "ime_frame"
path = "tests/ime_frame.rs"
harness = false

[features]
render-diagnostics = ["client/render-diagnostics", "host/render-diagnostics"]
memory-profile = ["host-play/memory-profile"]
# CPU diagnostic: use System directly, report allocator metrics unavailable.
memory-profile-no-alloc = ["memory-profile", "host-play/memory-profile-no-alloc"]

[dev-dependencies]
frontend-core = { path = "../frontend-core", features = ["test-support"] }
proc-macro2 = "1"
syn = "2"
parking_lot = "0.12"
