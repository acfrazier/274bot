[package]
name = "nav-uniform-census"
version = "0.1.0"
edition = "2021"
publish = false
build = "build.rs"

[workspace]

[dependencies]
nav = { path = "../../../crates/nav" }
api = { path = "../../../crates/api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[build-dependencies]
sha2 = "0.10"

[[bin]]
name = "nav-uniform-census"
path = "src/main.rs"

[[bin]]
name = "nav-fixture"
path = "src/bin/fixture.rs"
