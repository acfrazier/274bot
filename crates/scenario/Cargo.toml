[package]
name = "scenario"
version.workspace = true
edition = "2021"
publish = false

[dependencies]
api = { path = "../api" }
client = { workspace = true }
nav = { path = "../nav" }
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "=1.0.219", features = ["derive"] }
