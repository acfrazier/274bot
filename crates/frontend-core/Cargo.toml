[package]
name = "frontend-core"
version.workspace = true
edition = "2021"
publish = false

# Operator lifecycle shared by the native panel and the TUI. It depends on
# neither front end nor on any window/terminal library.
[dependencies]
api = { path = "../api" }
host = { path = "../host" }
host-play = { path = "../host-play", default-features = false }
nav-planner = { path = "../nav-planner" }
script = { path = "../script" }
script-js = { path = "../script-js", optional = true }
# The live harness's scenario runner (ruling D2(a)); only with `live-harness`.
scenario = { path = "../scenario", optional = true }
parking_lot = "0.12"
serde = "=1.0.219"
serde_json = "=1.0.140"
thiserror = "=2.0.20"
vault = { path = "../vault" }
zeroize = "=1.9.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
client = { workspace = true }
# Integration tests use the fixture seams behind this crate's test-support.
frontend-core = { path = ".", default-features = false, features = ["test-support"] }
# The capacity smoke forces the macOS/Windows measure and reads receipts.
host-play = { path = "../host-play", default-features = false, features = ["test-support"] }
nav-bake = { path = "../nav-bake" }
png = "=0.18.1"
scenario = { path = "../scenario" }

[features]
canvas-raster = ["script/canvas-raster"]
default = ["js"]
js = ["host-play/js", "dep:script-js", "canvas-raster"]
# Test-only lifecycle and capacity fixture seams; enabled from dev-dependencies,
# never production builds.
test-support = ["host-play/test-support", "host/test-support"]
# Forwarded from the front ends (ruling D3): the opt-in Debug command
# catalogue, the `--live`/`--smoke` harness, the memory benchmark and the
# render diagnostics.
debug-catalog = ["host-play/debug-catalog"]
live-harness = ["host-play/live-harness", "dep:scenario"]
memory-profile = ["host-play/memory-profile"]
memory-profile-no-alloc = ["memory-profile", "host-play/memory-profile-no-alloc"]
render-diagnostics = ["host/render-diagnostics"]
