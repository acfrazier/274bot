[package]
name = "panel"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
api = { path = "../api" }
dear-app = "0.15.1"
dear-imgui-rs = "0.15"
host = { path = "../host" }
host-play = { path = "../host-play" }
libc = "0.2"
nav = { path = "../nav" }
serde = { version = "=1.0.229", features = ["derive"] }
