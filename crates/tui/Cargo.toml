[package]
name = "tui"
version.workspace = true
edition = "2021"
publish = false

[dependencies]
api = { path = "../api" }
client = { workspace = true }
crossterm = "0.29"
frontend-core = { path = "../frontend-core" }
host-play = { path = "../host-play" }
libc = "0.2"
nav = { path = "../nav" }
ratatui = "0.30"
scenario = { path = "../scenario" }
script = { path = "../script" }
serde_json = "=1.0.140"
vault = { path = "../vault" }

[dev-dependencies]
frontend-core = { path = "../frontend-core", features = ["test-support"] }
host = { path = "../host" }
host-play = { path = "../host-play", features = ["test-support"] }

[[bin]]
name = "tui-play"
path = "src/main.rs"

[features]
memory-profile = ["host-play/memory-profile"]

# CPU diagnostic: use System directly, report allocator metrics unavailable.
memory-profile-no-alloc = ["memory-profile", "host-play/memory-profile-no-alloc"]
