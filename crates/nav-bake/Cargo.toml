[package]
name = "nav-bake"
version.workspace = true
edition = "2021"
publish = false

[lints]
workspace = true

[dependencies]
api = { path = "../api" }
nav-planner = { path = "../nav-planner" }
client = { workspace = true }
thiserror = "=2.0.20"
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"
sha2 = "=0.10.9"

[dev-dependencies]
allocation-counter = "=0.8.1"

[[bin]]
name = "nav-pack"
path = "src/bin/nav-pack.rs"

[[bin]]
name = "cache-content-id"
path = "src/bin/cache-content-id.rs"

[[bin]]
name = "nav-input-audit"
path = "src/bin/nav-input-audit.rs"
