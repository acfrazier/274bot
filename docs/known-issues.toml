# Known issues and release gaps: single source of truth.
#
# One [[item]] table per item. The `text` holds the end-user wording as it
# appears in the CHANGELOG (workaround included); `render` appends the "X has
# the same problem." sentence from `first` and the CHANGELOG release order.
# An item is open at release X when `first` is not newer than X and `fixed`
# (when set) is newer than X. Lifecycle: add the item with `first`; the
# commit that fixes it sets `fixed` to the release carrying the fix; never
# delete an item, so checks of published releases keep passing. `fixed` must
# name a known release or the next one and must be later than `first`.
# Never edit the CHANGELOG blocks by hand; regenerate them with
# tools/known-issues/known_issues.py.

[[item]]
id = "bank-native-planned"
kind = "not-in-release"
area = "Scripts"
text = """Native bank sorting (`sortBank`), quest-junk discovery (`findQuestJunk`),
  pack purging at a bank (`purgePackAtBank`) and coin withdrawal
  (`withdrawCoins`) are **Planned**, not included here. These calls still
  report `not impl`; moving existing banking into the native seat does not
  implement them."""
first = "0.2.4"
target = "none"
severity = "low"
owner = "scripts-misc"

[[item]]
id = "bank-routers-unavailable"
kind = "not-in-release"
area = "Scripts"
text = """Caller-supplied bank-cost routers (`nearestWalkableBank`,
  `nearestWalkableBankAsync`, `bankCostForFinder`, `bankCostForNavigator`) and
  random bank pacing (`bankPace`, `bankPaceTicks`) remain deliberately
  unavailable. The host does not recreate the foreign router or random pacing."""
first = "0.2.4"
target = "none"
severity = "low"
owner = "scripts-misc"

[[item]]
id = "jivekbd-dragon-bones"
kind = "not-in-release"
area = "Scripts"
text = """The JiveKBD hunting script (King Black Dragon) does not yet bring back
  Dragon bones reliably. In testing it ran out of food at the dragon and went
  to the bank without the bones. A fix is planned for 0.2.5."""
first = "0.2.4"
target = "0.2.5"
severity = "medium"
owner = "scripts-misc"

[[item]]
id = "windows-map-bake-resume"
kind = "not-in-release"
area = "Map bake (Windows)"
text = """On Windows, resuming a local map bake that stopped part-way (for example
  after a crash) and left a damaged tile can fail with "Access is denied"
  instead of repairing the tile. Release packages ship the baked map, so this
  affects only self-built copies and local bakes. A fix is planned for 0.2.5."""
first = "0.2.4"
target = "0.2.5"
severity = "low"
owner = "windows"

[[item]]
id = "gatherer-catherby-obelisk"
kind = "known-issue"
area = "Gatherer"
text = """a Catherby fishing card started from the Fishing Guild can pick a spot
  by the Water Obelisk island, which the bot cannot walk to, and it stops at
  once with a walk failure. Move the bot to the Catherby fishing beach and
  start the card again. A fix is planned for 0.2.5."""
first = "0.2.3"
target = "0.2.5"
severity = "medium"
owner = "scripts-misc"

[[item]]
id = "panel-linux-dual-gpu"
kind = "known-issue"
area = "Panel (Linux)"
text = """on a desktop with two graphics chips (for example a Ryzen with built-in
  graphics plus a separate graphics card), the panel can close right after it
  starts with "importing the supplied dmabufs failed". Start it with
  `WGPU_POWER_PREF=high ./panel-play` until this is fixed."""
first = "0.2.0.2"
target = "none"
severity = "high"
owner = "dual-gpu"
