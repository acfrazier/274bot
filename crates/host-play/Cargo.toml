[package]
name = "host-play"
version.workspace = true
edition = "2021"
publish = false

[dependencies]
api = { path = "../api" }
client = { workspace = true }
host = { path = "../host" }
nav-planner = { path = "../nav-planner" }
nav-executor = { path = "../nav-executor" }
scenario = { path = "../scenario", optional = true }
script = { path = "../script" }
script-js = { path = "../script-js", optional = true }
# Local-state preference edits preserve member order without the JS runtime too.
serde_json = { version = "=1.0.140", features = ["preserve_order"] }
serde = { version = "=1.0.219", features = ["derive"] }
sha2 = "=0.10.9"
thiserror = "=2.0.20"
libc = "0.2"
# The hidden passphrase prompt (`passphrase::read_hidden`) reads keys in raw
# mode, so nothing typed is echoed; same version the tui already builds.
# `use-dev-tty`: the default Unix event source reads 1 KiB per epoll edge and
# can leave the rest of a longer burst (a pasted passphrase and its Enter)
# unread until another key arrives; the poll(2) source reads it all.
crossterm = { version = "0.29", features = ["use-dev-tty"] }
zeroize = "=1.9.0"
vault = { path = "../vault" }
rand_core = { version = "=0.6.4", features = ["getrandom"] }
parking_lot = "0.12"
png = "=0.18.1"
# The build script bakes/stages the selected revision's navigation artifact
# and publishes its identities to the compile-time table (`nav_identity`).
[build-dependencies]
nav-planner = { path = "../nav-planner" }
nav-bake = { path = "../nav-bake" }
serde_json = "=1.0.140"

[dev-dependencies]
api = { path = "../api", features = ["test-support"] }
nav-bake = { path = "../nav-bake" }
allocation-counter = "=0.8.1"
bzip2 = "0.4"
# The local HTTPS update servers of `tests/cold_fill_lookups.rs`; the
# version that the client already builds.
native-tls = "=0.2.18"
script = { path = "../script", features = ["test-hooks"] }
script-js = { path = "../script-js", features = ["test-hooks"] }
scenario = { path = "../scenario" }

# These harnesses use the optional scenario runner even for their offline tests.
[[test]]
name = "catalog_boundary_live"
required-features = ["memory-profile"]

[[test]]
name = "world_boundary_live"
required-features = ["memory-profile"]

[[test]]
name = "grinch_live"
required-features = ["live-harness", "test-support"]

[[test]]
name = "script_api_live"
required-features = ["test-support", "js"]

[[test]]
name = "t2_family_live"
required-features = ["js"]

[[test]]
name = "two_slot_isolation_live"
required-features = ["js"]

[[test]]
name = "loadout_provision_live"
required-features = ["js"]

[[test]]
name = "paired_catalog_live"
required-features = ["js"]

[[test]]
name = "nav_gated_entrances_live"
required-features = ["test-support"]

[[test]]
name = "survivable_admission_live"
required-features = ["live-harness", "test-support", "live-probe"]

[[test]]
name = "seat_live"
required-features = ["live-harness", "test-support", "live-probe"]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
] }

[features]
default = ["js"]
js = ["dep:script-js"]
debug-catalog = ["api/debug-catalog"]
# Opt-in memory benchmark harness. No effect unless BOT_MEMORY_N is set.
# Frontend binaries install CountingAllocator (T3).
memory-profile = ["js", "script-js/memory-profile", "host/performance-profile", "dep:scenario"]

# CPU diagnostic: use System directly, report allocator metrics unavailable.
memory-profile-no-alloc = ["memory-profile"]

# The live harness's fleet launch (`live_start::fleet_catalog_starts`),
# shared by panel-play and tui-play.
live-harness = ["dep:scenario"]

# Test-only Play fixtures. Enabled from frontend dev-dependencies, never
# production builds.
test-support = ["api/test-support", "script/test-hooks", "script-js?/test-hooks", "nav-planner/test-support"]

# Read-only probe for the manual-click LIVE harnesses. Enabled from frontend
# dev-dependencies, never production builds.
live-probe = []

# Windows-only headed Quester journal paint proof. The code remains gated by
# both this feature and `cfg(windows)` so ordinary Mac/headless tests never
# construct a native window.
journal-paint-proof = ["client/headed-fixture", "host/journal-paint-proof"]
