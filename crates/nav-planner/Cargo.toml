[package]
name = "nav-planner"
version.workspace = true
edition = "2021"
publish = false

[lints]
workspace = true

[features]
test-support = ["dep:proc-macro2", "dep:syn"]

[dependencies]
api = { path = "../api" }
client = { workspace = true }
thiserror = "=2.0.20"
serde = { version = "=1.0.219", features = ["derive"] }
png = "=0.18.1"
serde_json = "=1.0.140"
sha2 = "=0.10.9"
syn = { version = "=2.0.119", features = ["full", "visit"], optional = true }
proc-macro2 = { version = "=1.0.107", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
allocation-counter = "=0.8.1"
syn = { version = "=2.0.119", features = ["full", "visit"] }
proc-macro2 = "=1.0.107"

