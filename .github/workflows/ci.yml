name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

# GitHub is a subset of local CI (see CONTRIBUTING.md): no LIVE=1, no GPU
# adapter (SKIP_GPU=1). The cargo graph is the same as local — host workspace
# plus vendor/fr-client-rust — once ALSA/X11 headers are present. ubuntu-latest
# does not ship libasound; panel enables client `audio` (cpal → alsa-sys).

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: |
          cargo fmt --all -- --check
          cargo fmt --all -- --check --manifest-path vendor/fr-client-rust/Cargo.toml

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Native libs (ALSA + window)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libasound2-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxrandr-dev
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: |
          cargo clippy --workspace --all-targets --no-deps -- -D warnings
          cargo clippy --manifest-path vendor/fr-client-rust/Cargo.toml --workspace --all-targets --no-deps -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    env:
      SKIP_GPU: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - name: Native libs (ALSA + window)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libasound2-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxrandr-dev
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: |
          cargo test --workspace
          cargo test --manifest-path vendor/fr-client-rust/Cargo.toml --workspace
