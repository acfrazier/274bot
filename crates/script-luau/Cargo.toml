[package]
name = "script-luau"
version.workspace = true
edition = "2021"
publish = false

[features]
# Integration-only test seams, enabled through dev-dependencies of the product
# crates. They forward the core's seams.
test-hooks = ["script/test-hooks"]

[dependencies]
api = { path = "../api" }
# Exact pin. `luau` builds the Luau VM from source (a C++17 compiler is a hard
# requirement of every build with this crate). `send` makes `Lua: Send`, which a
# run needs (`lib.rs`). The JIT, `async`, `serde` and `macros` stay off: the
# last one links `inventory`, which registers code before `main`.
mlua = { version = "=0.12.2", default-features = false, features = ["luau", "send"] }
script = { path = "../script" }
serde_json = "1.0.140"
vault = { path = "../vault" }

[dev-dependencies]
# The allocation gates of `tests/allocation.rs`; the version `script` already uses.
allocation-counter = "0.8.1"
# The native-row bootstrap scan uses the JSV2-FREEZE parser and features.
deno_ast = { version = "=0.49.0", features = ["scopes", "transpiling"] }
# The source scans of `tests/startup_state.rs` and `tests/thinness.rs`; the
# version `script` already uses.
syn = { version = "=2.0.119", features = ["full", "visit"] }
# Real TOML parsing for the live-map checks in `tests/thinness.rs`.
toml_edit = "=0.23.4"

[lints]
workspace = true
