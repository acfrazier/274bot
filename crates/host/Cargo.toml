[package]
name = "host"
version.workspace = true
edition = "2021"
publish = false

[dependencies]
api = { path = "../api" }
client = { workspace = true }
num-bigint = "0.4"
thiserror = "=2.0.20"
vault = { path = "../vault" }
parking_lot = { version = "0.12", optional = true }

[features]
render-diagnostics = ["client/render-diagnostics"]
render-test-hooks = ["client/render-test-hooks"]
draw-memory-profile = ["render-test-hooks", "client/draw-memory-profile"]
# Memory-only comparator selection and common owner census; never timing.
draw-memory-case = ["client/draw-memory-case"]
performance-profile = []
# Lossless, immutable paint witnesses for the Windows journal fixture only.
journal-paint-proof = ["dep:parking_lot"]
# Test-only capacity seams (force the time-off-the-CPU measure on Linux,
# per-service delay receipts). Enabled from dev-dependencies, never
# production builds.
test-support = []

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Networking_WinSock",
    "Win32_System_Threading",
] }

[dev-dependencies]
allocation-counter = "=0.8.1"
api = { path = "../api", features = ["test-support"] }
client = { workspace = true, features = ["test-support"] }
serde_json = "=1.0.140"
sha2 = "=0.10.9"
syn = { version = "=2.0.119", features = ["full", "visit", "extra-traits"] }
tungstenite = "0.24"
