name: CI

# Every job runs on pushes to main, dev and release/**, and on pull requests
# into main and dev. Outside contributors open pull requests against dev
# (CONTRIBUTING.md), so a pull request gets the full fmt, clippy, test and
# architecture checks before review.
on:
  push:
    branches: [main, dev, "release/**"]
  pull_request:
    branches: [main, dev]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # GitHub runners have no canonical 289 engine/content tree, so the build
  # stages no navigation bundle (checked-in identities only). Release builds
  # and LIVE runs keep the default `require` on machines with the inputs.
  BOT_NAV_BUILD: skip
  # Every test binary links V8; with debuginfo the host + client test builds
  # outgrow the runner disk.
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  # The reviewed v17 reference is published separately from application releases.
  # Main and the operator publish these immutable assets before this CI cutover.
  CI_NAV_PACK_RELEASE: "nav-reference-v17"
  CI_NAV_PACK_SHA256: 4e8ab5af4694cf6722ed3836c3e1f42e9ac1be136d4d1127c7db698f4fc6500b
  CI_NAV_FLAGS_SHA256: 67e4094dff06def5cf8abc172ce751f4ca8679532ba04c1ba15ab6bf668c7a4a

# GitHub is a subset of local CI (see CONTRIBUTING.md): no LIVE=1, no GPU
# adapter (SKIP_GPU=1). The cargo graph is the same as local — host workspace
# plus vendor/fr-client-rust — once ALSA/X11 headers are present. ubuntu-24.04
# does not ship libasound; panel enables client `audio` (cpal → alsa-sys).

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: fmt-ubuntu-24.04
      - name: Check formatting
        run: |
          cargo fmt --all -- --check
          cargo fmt --all --manifest-path vendor/fr-client-rust/Cargo.toml -- --check
      - name: Lint suppression ratchet
        run: |
          python3 -B tools/lint-ratchet/lint_ratchet.py --self-test
          python3 -B tools/lint-ratchet/lint_ratchet.py

  clippy:
    name: clippy
    if: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/heads/release/') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: clippy
      - name: Native libs (ALSA + window)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libasound2-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxrandr-dev
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: clippy-ubuntu-24.04
          cache-on-failure: true
          workspaces: |
            . -> target
            vendor/fr-client-rust -> target
      - name: Navigation action deny-list coverage
        run: python3 -B tools/architecture/nav_clippy.py --check
      - name: Clippy
        run: |
          cargo clippy --workspace --all-targets --no-deps -- -D warnings
          cargo clippy --manifest-path vendor/fr-client-rust/Cargo.toml --workspace --all-targets --no-deps -- -D warnings
          cargo clippy -p host --all-targets --no-deps --features performance-profile -- -D warnings
          cargo clippy -p host --all-targets --no-deps --features render-diagnostics -- -D warnings
          cargo clippy -p panel --all-targets --no-deps --features memory-profile -- -D warnings
          cargo clippy -p panel --all-targets --no-deps --features render-diagnostics -- -D warnings
          cargo clippy -p host-play --all-targets --no-deps --features memory-profile -- -D warnings
          cargo clippy -p host-play --all-targets --no-deps --features memory-profile-no-alloc -- -D warnings
          cargo clippy -p tui --all-targets --no-deps --features memory-profile -- -D warnings
          cargo clippy -p script --no-default-features --all-targets --no-deps -- -D warnings
          cargo clippy -p host-play --no-default-features --all-targets --no-deps -- -D warnings
          cargo clippy --manifest-path vendor/fr-client-rust/Cargo.toml --workspace --all-targets --no-deps --features render-test-hooks -- -D warnings
          cargo clippy -p host --all-targets --no-deps --features render-test-hooks -- -D warnings

  architecture:
    name: architecture
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch pinned client submodule as data
        run: |
          set -euo pipefail
          expected_module_keys="$(printf '%s\n' 'submodule.vendor/fr-client-rust.branch' 'submodule.vendor/fr-client-rust.path' 'submodule.vendor/fr-client-rust.url')"
          actual_module_keys="$(git config --no-includes -f .gitmodules --name-only --list | sort)"
          test "$actual_module_keys" = "$expected_module_keys"
          test "$(git config --no-includes -f .gitmodules --get-all submodule.vendor/fr-client-rust.path)" = "vendor/fr-client-rust"
          test "$(git config --no-includes -f .gitmodules --get-all submodule.vendor/fr-client-rust.url)" = "https://github.com/acfrazier/FR-client-bothost.git"
          test "$(git config --no-includes -f .gitmodules --get-all submodule.vendor/fr-client-rust.branch)" = "multirev-bh-modular"
          GIT_ALLOW_PROTOCOL=https git submodule update --init -- vendor/fr-client-rust
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.14.8"
          check-latest: false
      - name: Install hash-pinned rust-analyzer
        env:
          ARCH_RUST_ANALYZER_URL: ${{ vars.ARCH_RUST_ANALYZER_URL }}
        run: |
          set -euo pipefail
          : "${ARCH_RUST_ANALYZER_URL:?publish the pinned rust-analyzer artifact and set ARCH_RUST_ANALYZER_URL}"
          parser_dir="$RUNNER_TEMP/f0-rust-analyzer"
          mkdir -p "$parser_dir"
          curl --fail --location --retry 3 --output "$parser_dir/rust-analyzer.gz" "$ARCH_RUST_ANALYZER_URL"
          echo "040cab4e2abc490fadd95c3f6cbc60b941a78761dbc3acf0ec66fd7a97f31db3  $parser_dir/rust-analyzer.gz" | sha256sum --check -
          gzip -dc "$parser_dir/rust-analyzer.gz" > "$parser_dir/rust-analyzer"
          echo "fd89304c85f6c1996b036ea8f2c9ad9d3e25a197dbd713661c7fe51ec9dc8e49  $parser_dir/rust-analyzer" | sha256sum --check -
          chmod 0755 "$parser_dir/rust-analyzer"
          echo "$parser_dir" >> "$GITHUB_PATH"
          test "$("$parser_dir/rust-analyzer" --version)" = "rust-analyzer 0.3.3081-standalone"
      - name: Install pinned flatc
        env:
          FLATC_URL: https://github.com/google/flatbuffers/releases/download/v25.12.19/Linux.flatc.binary.g%2B%2B-13.zip
          FLATC_SHA256: 9f87066dc5dfa7fe02090b55bab5f3e55df03e32c9b0cdf229004ade7d091039
        run: |
          curl --fail --location --retry 3 --output /tmp/flatc.zip "$FLATC_URL"
          echo "$FLATC_SHA256  /tmp/flatc.zip" | sha256sum --check -
          unzip -q /tmp/flatc.zip -d /tmp/flatc
          sudo install -m 0755 /tmp/flatc/flatc /usr/local/bin/flatc
          cargo_flatbuffers="$(grep -F 'flatbuffers = { version = ' crates/script-js/Cargo.toml | cut -d '"' -f2)"
          cargo_flatbuffers="${cargo_flatbuffers#=}"
          test -n "$cargo_flatbuffers"
          test "$(flatc --version)" = "flatc version $cargo_flatbuffers"
      - name: Run operator-owned architecture check
        run: |
          set -euo pipefail
          checker_root="$RUNNER_TEMP/274bot-arch"
          git clone --depth 1 --branch release-0.2.8 https://github.com/acfrazier/274bot-arch.git "$checker_root"
          parser="$(command -v rust-analyzer)"
          printf '%s  %s\n' \
            fd89304c85f6c1996b036ea8f2c9ad9d3e25a197dbd713661c7fe51ec9dc8e49 \
            "$parser" | sha256sum --check --status
          test "$("$parser" --version)" = "rust-analyzer 0.3.3081-standalone"
          python3 -B "$checker_root/check.py" --self-test
          python3 -B "$checker_root/check.py" --root "$GITHUB_WORKSPACE"
      - name: Check FlatBuffer bindings
        run: |
          generated="$(mktemp -d)"
          trap 'rm -rf "$generated"' EXIT
          flatc --rust -o "$generated" crates/script-js/schema/isolate.fbs
          diff -ru crates/script-js/schema/generated "$generated"
  test_lanes:
    name: test (${{ matrix.lane }})
    if: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/heads/release/') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: workspace
            free_disk: true
            cache_key: workspace
            save_cache: true
            real_nav_pack: true
            os: ubuntu-24.04
            command: "cargo test --workspace"
          - lane: vendor
            free_disk: false
            cache_key: vendor
            save_cache: true
            os: ubuntu-24.04
            command: "cargo test --manifest-path vendor/fr-client-rust/Cargo.toml --workspace"
          - lane: script-load
            free_disk: false
            cache_key: workspace
            save_cache: false
            real_nav_pack: true
            os: ubuntu-24.04
            command: "cargo test -p script-js --tests"
          - lane: script-no-default
            free_disk: false
            cache_key: workspace
            save_cache: false
            real_nav_pack: true
            os: ubuntu-24.04
            command: "cargo test -p script --no-default-features"
          - lane: native-only
            free_disk: false
            cache_key: workspace
            save_cache: false
            real_nav_pack: true
            os: ubuntu-24.04
            command: "cargo build -p panel --no-default-features && cargo build -p tui --no-default-features && cargo build -p host-play --no-default-features && cargo test -p host-play --no-default-features --lib && python3 -B tools/architecture/native_dependencies.py --self-test && python3 -B tools/architecture/native_dependencies.py"
          - lane: grinch-oracles
            free_disk: false
            cache_key: workspace
            save_cache: false
            os: ubuntu-24.04
            command: "cargo test -p host-play --features live-harness,test-support --test grinch_live"
          - lane: host-play-memory
            free_disk: false
            cache_key: workspace
            save_cache: false
            os: ubuntu-24.04
            command: "cargo test -p host-play --features memory-profile"
          - lane: host-play-memory-no-alloc
            free_disk: false
            cache_key: workspace
            save_cache: false
            os: ubuntu-24.04
            command: "cargo test -p host-play --features memory-profile-no-alloc --lib"
          - lane: host-performance
            free_disk: false
            cache_key: workspace
            save_cache: false
            os: ubuntu-24.04
            command: "cargo test -p host --features performance-profile"
          - lane: panel-memory
            free_disk: false
            cache_key: workspace
            save_cache: false
            os: ubuntu-24.04
            command: "cargo test -p panel --features memory-profile && xvfb-run -a cargo test -p panel --features memory-profile --test ime_frame"
          - lane: panel-render-diagnostics
            free_disk: false
            cache_key: workspace
            save_cache: false
            os: ubuntu-24.04
            command: "cargo test -p panel --features render-diagnostics --lib"
          - lane: tui-memory
            free_disk: false
            cache_key: workspace
            save_cache: false
            os: ubuntu-24.04
            command: "cargo test -p tui --features memory-profile"
          - lane: host-play-memory-26.04
            os: ubuntu-26.04
            free_disk: false
            cache_key: workspace
            save_cache: true
            command: "cargo test -p host-play --features memory-profile"
          - lane: vendor-render-test-hooks
            free_disk: false
            cache_key: vendor
            save_cache: true
            os: ubuntu-24.04
            command: "cargo test --manifest-path vendor/fr-client-rust/Cargo.toml --workspace --features render-test-hooks"
          - lane: host-render-test-hooks
            free_disk: false
            cache_key: workspace
            save_cache: false
            os: ubuntu-24.04
            command: "cargo test -p host --features render-test-hooks"
    runs-on: ${{ matrix.os }}
    env:
      SKIP_GPU: "1"
    steps:
      - name: Free runner disk
        if: ${{ matrix.free_disk }}
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@1.98.1
      - name: Native libs (ALSA + window)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libasound2-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-0 \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxrandr-dev \
            xvfb
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-${{ matrix.os }}-${{ matrix.cache_key }}
          cache-on-failure: true
          save-if: ${{ matrix.save_cache }}
          workspaces: |
            . -> target
            vendor/fr-client-rust -> target
      - name: Cache the 289 nav pack
        if: ${{ matrix.real_nav_pack }}
        id: nav-pack-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/nav-289
          key: nav-289-${{ env.CI_NAV_PACK_SHA256 }}
      - name: Fetch the 289 nav pack
        if: ${{ matrix.real_nav_pack && steps.nav-pack-cache.outputs.cache-hit != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/nav-289"
          gh release download "$CI_NAV_PACK_RELEASE" -R "$GITHUB_REPOSITORY" \
            -p "274bot-289-v17.navpack" -p "274bot-289-v17.navflags" \
            -D "$RUNNER_TEMP/nav-289"
      - name: Use the 289 nav pack
        if: ${{ matrix.real_nav_pack }}
        run: |
          echo "$CI_NAV_PACK_SHA256  $RUNNER_TEMP/nav-289/274bot-289-v17.navpack" | sha256sum -c -
          echo "$CI_NAV_FLAGS_SHA256  $RUNNER_TEMP/nav-289/274bot-289-v17.navflags" | sha256sum -c -
          echo "NAV_PACK=$RUNNER_TEMP/nav-289/274bot-289-v17.navpack" >> "$GITHUB_ENV"
          echo "WORLD_NAV_PACK=$RUNNER_TEMP/nav-289/274bot-289-v17.navpack" >> "$GITHUB_ENV"
          echo "NAV_ARRIVAL_PACK=$RUNNER_TEMP/nav-289/274bot-289-v17.navpack" >> "$GITHUB_ENV"
      - name: Test ${{ matrix.lane }}
        run: ${{ matrix.command }}

  # Preserve the required `test` status while the expensive commands fan out.
  test:
    name: test
    if: ${{ always() && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/heads/release/')) }}
    needs: test_lanes
    runs-on: ubuntu-24.04
    steps:
      - name: Require every test lane
        env:
          LANES_RESULT: ${{ needs.test_lanes.result }}
        run: test "$LANES_RESULT" = success
