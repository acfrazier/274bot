# Live cells the nightly run does not start, with the reason printed in the
# summary. Format: <cell name><TAB or spaces><reason>. A skipped cell is
# still listed in summary.json/summary.md as SKIP with this reason; nothing
# is dropped silently. Names are scenario names (without the `script_`
# prefix). Cells that need a different engine (for example Engine Q at a
# 300 ms world tick) belong here.
quester_path    needs QUESTER_PATH (one quest id per run) and its seeds; run through the Quester Path smoke, not the catalog sweep
